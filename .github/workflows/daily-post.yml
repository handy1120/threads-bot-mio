name: Daily Threads Post (mio)

on:
  schedule:
    # 毎日 21:00 UTC (= JST 6:00 の翌日) に実行
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write # posted.json をコミットして状態を永続化するため
    concurrency:
      group: daily-post
      cancel-in-progress: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run post script
        env:
          THREADS_SESSION_ID: ${{ secrets.THREADS_SESSION_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          NOTIFY_EMAIL_PASS: ${{ secrets.NOTIFY_EMAIL_PASS }}
        run: node post.js

      # 投稿済み記事の履歴をリポジトリに書き戻して永続化する。
      # （Actions cache は失敗時に保存されず・7日で消えるため、同じ記事を
      #   毎日投稿する原因になっていた）
      # 投稿に成功した直後に posted.json が更新されるので、後続が失敗しても
      # 記録が残るよう if: always() で実行する。
      - name: Persist posted.json
        if: always()
        run: |
          if [ -z "$(git status --porcelain posted.json)" ]; then
            echo "posted.json に変更なし"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git commit -m "chore: posted.json を更新 [skip ci]"
          git pull --rebase --autostash
          git push

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            log.txt
            posted.json
            debug_*.png
          retention-days: 30
